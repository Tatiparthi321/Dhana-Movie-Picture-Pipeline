name: Frontend Continuous Deployment

on:
push:
branches:
- main
paths:
- 'starter/frontend/**'
workflow_dispatch:

jobs:
lint:
runs-on: ubuntu-latest
defaults:
run:
working-directory: starter/frontend

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version-file: 'starter/frontend/.nvmrc'
      cache: npm
      cache-dependency-path: 'starter/frontend/package-lock.json'

  - name: Install dependencies
    run: npm ci

  - name: Run lint
    run: npm run lint
```

test:
runs-on: ubuntu-latest
defaults:
run:
working-directory: starter/frontend

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version-file: 'starter/frontend/.nvmrc'
      cache: npm
      cache-dependency-path: 'starter/frontend/package-lock.json'

  - name: Install dependencies
    run: npm ci

  - name: Run tests
    run: CI=true npm test -- --watchAll=false
```

build:
runs-on: ubuntu-latest
needs:
- lint
- test

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build and push frontend image
    working-directory: starter/frontend
    env:
      ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR }}
      IMAGE_TAG: ${{ github.sha }}
      MOVIE_API_URL: ${{ secrets.MOVIE_API_URL }}
    run: |
      docker build \
        --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_URL" \
        --tag "$ECR_REPOSITORY:$IMAGE_TAG" \
        .

      docker push "$ECR_REPOSITORY:$IMAGE_TAG"
```

deploy:
runs-on: ubuntu-latest
needs: build

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Configure kubectl
    run: |
      aws eks update-kubeconfig \
        --name "${{ secrets.EKS_CLUSTER_NAME }}" \
        --region "${{ secrets.AWS_REGION }}"

  - name: Install Kustomize
    run: |
      curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_v5.7.1_linux_amd64.tar.gz
      tar -xzf kustomize.tar.gz
      sudo mv kustomize /usr/local/bin/kustomize

  - name: Deploy frontend
    working-directory: starter/frontend/k8s
    env:
      ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      kustomize edit set image frontend="$ECR_REPOSITORY:$IMAGE_TAG"
      kubectl apply -k .
      kubectl rollout status deployment/frontend --timeout=180s
```
